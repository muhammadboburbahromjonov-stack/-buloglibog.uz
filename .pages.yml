# Admin panel: https://app.pagescms.org (GitHub akkaunt bilan kiriladi)
media: images
content:
  - name: sayt
    label: Sayt ma'lumotlari
    type: file
    path: data/sayt.json
    format: json
    fields:
      - name: telefon
        label: Telefon raqami (masalan, +998 77 324 00 03)
        type: string
        required: true
      - name: narx_oddiy
        label: "Oddiy xona narxi (1 kishi / 1 kun, so'm). Kurs narxlari shundan hisoblanadi"
        type: number
        required: true
      - name: narx_pol_lyuks
        label: "Pol-lyuks xona narxi (1 kishi / 1 kun, so'm)"
        type: number
        required: true
      - name: narx_lyuks
        label: "Lyuks xona narxi (1 kishi / 1 kun, so'm)"
        type: number
        required: true
      - name: shior_uz
        label: Shior (o'zbekcha)
        type: string
      - name: shior_ru
        label: Shior (ruscha)
        type: string
      - name: ariza_havola
        label: Onlayn ariza (Google Form) havolasi
        type: string
